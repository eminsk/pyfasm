[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfasm64"
version = "2.1.0"
description = "Universal Native No-GIL (3.13t-3.16t) & PyPy (3.8-3.12) to pure x86_64 FASM compiler & bundler for Windows, Linux, macOS, and DLL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "eminsk", email = "M_N_N@tut.by" }
]
requires-python = ">=3.8"
dependencies = []
keywords = ["compiler", "fasm", "assembler", "x86-64", "native", "nogil", "aot", "pyfasm", "pyfasm64"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Assemblers",
]

[project.scripts]
pyfasm64 = "pyfasm.cli:main"
pyfasm = "pyfasm.cli:main"

[project.urls]
Homepage = "https://eminsk.github.io/#pyfasm"
Documentation = "https://github.com/eminsk/pyfasm#readme"
Repository = "https://github.com/eminsk/pyfasm"
Issues = "https://github.com/eminsk/pyfasm/issues"
Forum = "https://board.flatassembler.net/topic.php?t=24431"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfasm", "src/pyfasm64"]
artifacts = [
    "src/pyfasm/bin/*",
    "src/pyfasm/templates/**/*.asm",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/tools",
    "/tests",
    "README.md",
    "README_RU.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
