context:
  name: pyfasm
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - pyfasm = pyfasm.cli:main

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.8

tests:
  - python:
      imports:
        - pyfasm
      pip_check: true

about:
  homepage: https://github.com/eminsk/pyfasm
  license: MIT
  summary: Universal Native No-GIL (3.13t-3.16t) & PyPy (3.8-3.12) to pure x86_64 FASM compiler & bundler for Windows, Linux, macOS, DLL, and MyOS 10
