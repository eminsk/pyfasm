name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup FASM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\proekts\FASM"
          curl.exe -L "https://flatassembler.net/fasmw17332.zip" -o "$env:TEMP\fasm.zip"
          Expand-Archive -Path "$env:TEMP\fasm.zip" -DestinationPath "C:\proekts\FASM" -Force
          Write-Output "C:\proekts\FASM" >> $env:GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest Test Suite
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v
