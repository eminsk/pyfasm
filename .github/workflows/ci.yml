name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-windows-cpython:
    name: Windows CPython ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.16"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest Test Suite
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v

  test-windows-nogil:
    name: Windows No-GIL (Free-Threaded) ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "3.16t"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest Test Suite
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v

  test-windows-pypy:
    name: Windows PyPy ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "pypy3.8"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"
          - "pypy3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest Test Suite
        continue-on-error: ${{ matrix.python-version == 'pypy3.8' }}
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v

  test-linux:
    name: Linux ELF64 (Ubuntu) Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.13t"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set permissions for bundled FASM
        run: |
          chmod +x tools/fasm/fasm.x64 tools/fasm/fasm || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest Test Suite on Linux
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v

  test-macos:
    name: Apple macOS Mach-O (Darwin) Python ${{ matrix.python-version }}
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set permissions for bundled FASM
        run: |
          chmod +x tools/fasm/fasm.darwin tools/fasm/fasm || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest Test Suite on Apple macOS
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v
